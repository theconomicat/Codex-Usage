name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app
        run: ./Scripts/package_app.sh

      - name: Package zip
        run: |
          mkdir -p outputs
          ditto -c -k --norsrc --keepParent Codex-Usage.app outputs/Codex-Usage-macos.zip

      - name: Upload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" outputs/Codex-Usage-macos.zip \
            --title "$TAG" \
            --generate-notes
